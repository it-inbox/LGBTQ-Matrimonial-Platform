services:
  - type: web
    name: everpride-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npx pnpm@9.15.0 install --frozen-lockfile && npx pnpm@9.15.0 --filter @everpride/database db:generate && npx pnpm@9.15.0 --filter @everpride/shared build && npx pnpm@9.15.0 --filter @everpride/auth build && npx pnpm@9.15.0 --filter @everpride/api build
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4001
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
