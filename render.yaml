services:
  - type: web
    name: everpride-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @everpride/database db:generate && pnpm --filter @everpride/shared build && pnpm --filter @everpride/auth build && pnpm --filter @everpride/api build
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4001
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
